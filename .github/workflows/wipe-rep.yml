name: WIPE REPOSITORY (DANGEROUS)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "YES_I_WANT_TO_WIPE" to confirm'
        required: true

jobs:
  wipe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify confirmation
        run: |
          if [[ "${{ github.event.inputs.confirm }}" != "YES_I_WANT_TO_WIPE" ]]; then
            echo "❌ Confirmation failed. Aborting."
            exit 1
          fi
          echo "✅ Wipe confirmed. Proceeding..."

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Remove all files
        run: |
          # Remove everything except .git directory
          shopt -s dotglob
          rm -rf ./* ./.??* 2>/dev/null || true

      - name: Create empty commit
        run: |
          git add -A
          git commit --allow-empty -m "🔥 Wipe repository - all files removed" || echo "Nothing new to commit"

      - name: Force push
        run: |
          git push origin HEAD --force
