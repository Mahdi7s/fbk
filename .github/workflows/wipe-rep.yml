name: WIPE REPOSITORY (DANGEROUS)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type YES_I_WANT_TO_WIPE to confirm'
        required: true

jobs:
  wipe:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # Explicitly request write permission

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Confirmation
        run: |
          if [[ "${{ github.event.inputs.confirm }}" != "YES_I_WANT_TO_WIPE" ]]; then
            echo "❌ Wrong confirmation phrase. Aborting."
            exit 1
          fi
          echo "✅ Wipe confirmed."

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Remove all files
        run: |
          shopt -s dotglob nullglob
          rm -rf ./* ./.??* 2>/dev/null || true

      - name: Create empty commit
        run: |
          git add -A
          git commit --allow-empty -m "🔥 Repository wiped - all files removed" || true

      - name: Force Push
        run: |
          git push origin HEAD --force
