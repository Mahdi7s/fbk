name: WIPE REPOSITORY STABLE

on:
  workflow_dispatch:

jobs:
  wipe:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Remove all tracked files safely
        run: |
          git rm -r --cached . || true
          find . -mindepth 1 -not -path "./.git/*" -delete

      - name: Create empty commit (safe)
        run: |
          git commit -m "🔥 Wipe repo" || echo "Nothing to commit"

      - name: Push force
        run: |
          git push origin HEAD --force
