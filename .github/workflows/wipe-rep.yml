name: WIPE REPOSITORY SAFE

on:
  workflow_dispatch:

jobs:
  wipe:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Delete all tracked + untracked files
        run: |
          find . -mindepth 1 -not -path "./.git/*" -delete

      - name: Stage changes
        run: git add -A

      - name: Commit (ignore empty state safely)
        run: |
          git commit -m "🔥 Wipe repository content" || echo "No changes to commit"

      - name: Push to current branch
        run: |
          BRANCH=$(git rev-parse --abbrev-ref HEAD)
          git push origin HEAD:$BRANCH --force
